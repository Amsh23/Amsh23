name: Daily GitHub learning report to Telegram

on:
  schedule:
    # GitHub Actions cron is UTC: 16:07 UTC = 19:37 Asia/Tehran.
    - cron: "7 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram-learning-report:
    runs-on: ubuntu-latest
    steps:
      - name: Search GitHub broadly and send a Persian learning report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_ACTOR: Amsh23
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone

          bot_token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          actor = os.environ["GITHUB_ACTOR"]

          def api(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "Amsh23-Daily-Learning-Reporter",
                  },
              )
              with urllib.request.urlopen(req, timeout=35) as response:
                  return json.loads(response.read().decode("utf-8"))

          def search(endpoint, query, per_page=100):
              params = urllib.parse.urlencode({
                  "q": query, "sort": "updated", "order": "desc",
                  "per_page": str(per_page), "page": "1"
              })
              data = api(f"https://api.github.com/search/{endpoint}?{params}")
              return data.get("items", [])

          # Search globally across public GitHub, not just the user's recent event feed.
          # Start with 7 days; if empty, widen to 30 days.
          now = datetime.now(timezone.utc)
          window_days = 7
          since = (now - timedelta(days=window_days)).strftime("%Y-%m-%d")

          def collect(days):
              since_date = (now - timedelta(days=days)).strftime("%Y-%m-%d")
              prs = search("issues", f"author:{actor} is:pr created:>={since_date}")
              issues = search("issues", f"author:{actor} is:issue created:>={since_date}")
              commits = search("commits", f"author:{actor} committer-date:>={since_date}")
              return since_date, prs, issues, commits

          since, prs, issues, commits = collect(7)
          if not prs and not issues and not commits:
              window_days = 30
              since, prs, issues, commits = collect(window_days)

          lines = [
              "🧑‍💻 گزارش و درس روزانه GitHub",
              f"👤 حساب: {actor}",
              f"🔎 جست‌وجوی سراسری مخازن عمومی از {since} تا امروز ({window_days} روز)",
              "",
          ]

          found = False

          if prs:
              found = True
              lines.append(f"🔀 Pull Requestهای ایجادشده توسط شما ({len(prs)}):")
              for pr in prs[:5]:
                  repo = pr.get("repository_url", "").replace("https://api.github.com/repos/", "")
                  lines += [
                      "━━━━━━━━━━━━━━━━━━",
                      f"📌 {pr.get('title', 'بدون عنوان')}",
                      f"📦 {repo}",
                      f"🔗 {pr.get('html_url', '')}",
                  ]
                  number = pr.get("number")
                  if number and repo:
                      try:
                          files = api(f"https://api.github.com/repos/{repo}/pulls/{number}/files?per_page=30")
                          if files:
                              lines.append("📂 فایل‌های تغییرکرده و مفهوم آن‌ها:")
                              for file in files[:10]:
                                  filename = file.get("filename", "?")
                                  status = file.get("status", "modified")
                                  lines.append(
                                      f"• {filename}: {status}، +{file.get('additions', 0)}/-{file.get('deletions', 0)} خط"
                                  )
                                  patch = file.get("patch", "")
                                  additions = [
                                      x[1:].strip() for x in patch.splitlines()
                                      if x.startswith("+") and not x.startswith("+++")
                                  ]
                                  if additions:
                                      lines.append("  نمونه تغییر: " + " | ".join(additions[:2])[:220])
                              lines += [
                                  "🎓 درس: فایل‌های تغییرکرده نشان می‌دهند PR کدام بخش‌های پروژه را دست‌کاری کرده است. تغییرات هر فایل را با توضیح PR تطبیق بده.",
                                  "🧪 بررسی تست: این گزارش تست‌ها را اجرا نمی‌کند؛ وضعیت Checks را در صفحه PR ببین و نتیجه را همان‌جا تأیید کن.",
                              ]
                          else:
                              lines.append("جزئیات فایل‌های PR در دسترس نبود.")
                      except Exception as exc:
                          lines.append(f"⚠️ دریافت فایل‌های PR ناموفق بود: {type(exc).__name__}")
                  lines.append("")

          if issues:
              found = True
              lines.append(f"📝 Issueهای ایجادشده توسط شما ({len(issues)}):")
              for item in issues[:5]:
                  repo = item.get("repository_url", "").replace("https://api.github.com/repos/", "")
                  body = " ".join((item.get("body") or "").split())
                  lines += [
                      "━━━━━━━━━━━━━━━━━━",
                      f"📌 {item.get('title', 'بدون عنوان')}",
                      f"📦 {repo}",
                      f"🔗 {item.get('html_url', '')}",
                  ]
                  if body:
                      lines.append("📖 شرح: " + body[:650])
                  lines.append("🎓 تمرین: مسئله را به ورودی، خروجی مورد انتظار و شرایط بازتولید تقسیم کن.")
                  lines.append("")

          if commits:
              found = True
              lines.append(f"💾 Commitهای نوشته‌شده توسط شما ({len(commits)}):")
              for item in commits[:8]:
                  repo = item.get("repository", {}).get("full_name", "مخزن نامشخص")
                  commit = item.get("commit", {})
                  sha = item.get("sha", "")
                  message = (commit.get("message") or "بدون پیام").splitlines()[0]
                  lines += [
                      "━━━━━━━━━━━━━━━━━━",
                      f"📦 {repo}",
                      f"🧾 {message}",
                      f"🔗 {item.get('html_url', '')}",
                  ]
                  if sha:
                      try:
                          detail = api(f"https://api.github.com/repos/{repo}/commits/{sha}")
                          files = detail.get("files", [])
                          if files:
                              lines.append("📂 فایل‌های commit:")
                              for file in files[:8]:
                                  lines.append(
                                      f"• {file.get('filename', '?')} (+{file.get('additions', 0)}/-{file.get('deletions', 0)})"
                                  )
                                  patch = file.get("patch", "")
                                  additions = [
                                      x[1:].strip() for x in patch.splitlines()
                                      if x.startswith("+") and not x.startswith("+++")
                                  ]
                                  if additions:
                                      lines.append("  نمونه کد: " + " | ".join(additions[:2])[:200])
                              lines.append("🎓 درس: پیام commit خلاصه هدف تغییر است؛ فایل‌ها و diff نشان می‌دهند چه چیزی واقعاً عوض شده.")
                          else:
                              lines.append("جزئیات diff برای این commit در دسترس نبود.")
                      except Exception as exc:
                          lines.append(f"⚠️ دریافت diff ممکن نشد: {type(exc).__name__}")
                  lines.append("")

          if not found:
              lines += [
                  "با جست‌وجوی سراسری PR، Issue و Commit در مخازن عمومی، در بازه ۳۰ روزه هم نتیجه‌ای برای این حساب پیدا نشد.",
                  "این جست‌وجو دیگر فقط به Event Feed محدود نیست؛ با این حال فعالیت خصوصی، commitهایی با ایمیل/نام کاربری متفاوت یا رویدادهای ایندکس‌نشده ممکن است دیده نشوند.",
                  "",
                  "🎯 تمرین امروز: یک مخزن عمومی را انتخاب کن، README و CONTRIBUTING را بخوان و یک Issue مناسب مبتدی‌ها پیدا کن.",
              ]

          lines += [
              "",
              "📌 این گزارش فقط داده‌های عمومی قابل جست‌وجوی GitHub را پوشش می‌دهد.",
              "🤖 Workflow گزارش‌ساز است؛ خودش کد را تغییر نمی‌دهد، PR باز نمی‌کند و تستی را اجراشده فرض نمی‌کند.",
          ]

          message = "\n".join(lines)
          if len(message) > 3900:
              message = message[:3800] + "\n\n… برای جزئیات کامل لینک‌ها را باز کن."

          payload = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": message,
              "disable_web_page_preview": "true",
          }).encode()
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{bot_token}/sendMessage",
              data=payload,
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=35) as response:
              result = json.loads(response.read().decode("utf-8"))
          if not result.get("ok"):
              raise RuntimeError("Telegram API did not confirm message delivery")
          print("Telegram learning report sent.")
          PY
