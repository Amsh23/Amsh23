name: Daily GitHub report to Telegram

on:
  schedule:
    # 16:07 UTC = 19:37 Asia/Tehran
    - cron: "7 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Send daily GitHub activity report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_ACTOR: Amsh23
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone

          bot_token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          actor = os.environ["GITHUB_ACTOR"]
          cutoff = datetime.now(timezone.utc) - timedelta(hours=24)

          def get_json(url):
              req = urllib.request.Request(
                  url,
                  headers={"Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28"}
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          events = get_json(f"https://api.github.com/users/{actor}/events?per_page=100")
          relevant = []
          for event in events:
              created = datetime.fromisoformat(event["created_at"].replace("Z", "+00:00"))
              if created < cutoff:
                  continue
              if event["type"] in ("PullRequestEvent", "IssuesEvent"):
                  relevant.append(event)

          lines = [
              "🧑‍💻 گزارش روزانه GitHub",
              "📅 رویدادهای عمومی ۲۴ ساعت گذشته",
              ""
          ]

          if not relevant:
              lines += [
                  "در رویدادهای عمومی اخیر، PR یا Issue تازه‌ای پیدا نشد.",
                  "ممکن است فعالیت خصوصی یا رویدادهای قدیمی‌تر در این گزارش نمایش داده نشوند."
              ]
          else:
              for event in relevant[:15]:
                  payload = event.get("payload", {})
                  item = payload.get("pull_request") or payload.get("issue") or {}
                  repo = event.get("repo", {}).get("name", "مخزن نامشخص")
                  title = item.get("title", "بدون عنوان")
                  url = item.get("html_url", "")
                  action = payload.get("action", "updated")
                  kind = "🔀 Pull Request" if event["type"] == "PullRequestEvent" else "📝 Issue"
                  lines += [f"{kind} — {action}", f"• {title}", f"  مخزن: {repo}"]
                  if url:
                      lines.append(f"  {url}")
                  lines.append("")

          lines += [
              "📚 نکته یادگیری: برای هر PR، مسئله، فایل‌های تغییرکرده و تست‌های اجراشده را بررسی کن و بتوانی دلیل هر تغییر را توضیح بدهی.",
              "ℹ️ این پیام فقط رویدادهای عمومی GitHub را گزارش می‌کند؛ گزارش اجرای مشارکت روزانه ChatGPT یا فعالیت خصوصی نیست."
          ]

          message = "\n".join(lines)
          if len(message) > 3900:
              message = message[:3850] + "\n\n… گزارش کوتاه شد."

          payload = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": message,
              "disable_web_page_preview": "true"
          }).encode()
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{bot_token}/sendMessage",
              data=payload,
              method="POST"
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              result = json.loads(response.read().decode("utf-8"))
          if not result.get("ok"):
              raise RuntimeError("Telegram API did not confirm message delivery")
          print("Telegram message delivered.")
          PY
