name: Daily GitHub report to Telegram

on:
  schedule:
    # 16:07 UTC = 19:37 Asia/Tehran
    - cron: "7 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Send daily GitHub activity report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_ACTOR: Amsh23
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone

          bot_token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          gh_token = os.environ["GH_TOKEN"]
          actor = os.environ["GITHUB_ACTOR"]
          since = (datetime.now(timezone.utc) - timedelta(days=1)).strftime("%Y-%m-%d")

          def get_json(url, token, accept="application/vnd.github+json"):
              req = urllib.request.Request(
                  url,
                  headers={"Authorization": f"Bearer {token}", "Accept": accept,
                           "X-GitHub-Api-Version": "2022-11-28"}
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          query = urllib.parse.urlencode({
              "q": f"author:{actor} created:>={since} is:pr",
              "sort": "created", "order": "desc", "per_page": "20"
          })
          prs = get_json("https://api.github.com/search/issues?" + query, gh_token)["items"]

          query = urllib.parse.urlencode({
              "q": f"author:{actor} created:>={since} is:issue",
              "sort": "created", "order": "desc", "per_page": "20"
          })
          issues = get_json("https://api.github.com/search/issues?" + query, gh_token)["items"]

          lines = [
              "🧑‍💻 گزارش روزانه GitHub",
              f"📅 فعالیت‌های ثبت‌شده از ۲۴ ساعت گذشته (از {since} UTC)",
              ""
          ]

          if not prs and not issues:
              lines.append("امروز در حساب GitHub فعالیت جدیدی به شکل PR یا Issue پیدا نشد.")
              lines.append("این به معنی انجام نشدن کار خارج از GitHub نیست.")
          else:
              if prs:
                  lines.append(f"🔀 Pull Requestها ({len(prs)}):")
                  for item in prs:
                      repo = item.get("repository_url", "").replace("https://api.github.com/repos/", "")
                      state = "باز" if item.get("state") == "open" else "بسته"
                      body = " ".join((item.get("body") or "").split())
                      if len(body) > 500:
                          body = body[:497] + "..."
                      lines.extend([
                          f"• {item['title']} ({state})",
                          f"  مخزن: {repo}",
                          f"  {item['html_url']}"
                      ])
                      if body:
                          lines.append(f"  توضیح: {body}")
                      lines.append("")
              if issues:
                  lines.append(f"📝 Issueها ({len(issues)}):")
                  for item in issues:
                      repo = item.get("repository_url", "").replace("https://api.github.com/repos/", "")
                      lines.extend([
                          f"• {item['title']}",
                          f"  مخزن: {repo}",
                          f"  {item['html_url']}",
                          ""
                      ])

          lines += [
              "📚 نکته یادگیری: قبل از بستن یا ادغام هر PR، توضیح مسئله، فایل‌های تغییرکرده و تست‌های اجراشده را بخوان و مطمئن شو دلیل هر تغییر را می‌فهمی.",
              "ℹ️ این گزارش از فعالیت عمومی قابل مشاهده در GitHub ساخته شده؛ اجرای کار توسط ChatGPT را مستقلاً تأیید نمی‌کند."
          ]

          message = "\n".join(lines)
          # Telegram message limit is 4096 characters.
          if len(message) > 3900:
              message = message[:3850] + "\n\n… ادامه گزارش در GitHub قابل مشاهده است."

          payload = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": message,
              "disable_web_page_preview": "true"
          }).encode()
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{bot_token}/sendMessage",
              data=payload,
              method="POST"
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              result = json.loads(response.read().decode("utf-8"))
          if not result.get("ok"):
              raise RuntimeError("Telegram API did not confirm message delivery")
          print("Telegram message delivered.")
          PY
