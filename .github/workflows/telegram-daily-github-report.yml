name: Daily GitHub learning report to Telegram

on:
  schedule:
    # GitHub Actions uses UTC. 16:07 UTC = 19:37 Asia/Tehran.
    - cron: "7 16 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  telegram-learning-report:
    runs-on: ubuntu-latest
    steps:
      - name: Collect recent public contributions and explain them
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_ACTOR: Amsh23
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone

          token = os.environ["GH_TOKEN"]
          bot_token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          actor = os.environ["GITHUB_ACTOR"]
          cutoff = datetime.now(timezone.utc) - timedelta(hours=24)

          def api(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          events = api(f"https://api.github.com/users/{actor}/events?per_page=100")
          contributions = []
          seen = set()

          for event in events:
              created = datetime.fromisoformat(event["created_at"].replace("Z", "+00:00"))
              if created < cutoff:
                  continue
              if event.get("type") not in ("PullRequestEvent", "IssuesEvent"):
                  continue
              payload = event.get("payload", {})
              obj = payload.get("pull_request") or payload.get("issue")
              if not obj:
                  continue
              url = obj.get("html_url")
              if not url or url in seen:
                  continue
              seen.add(url)
              contributions.append((event, obj))

          lines = [
              "🧑‍💻 گزارش و درس روزانه GitHub",
              f"🕒 بازه بررسی: ۲۴ ساعت گذشته | حساب: {actor}",
              "",
          ]

          if not contributions:
              lines += [
                  "در ۲۴ ساعت گذشته PR یا Issue عمومی تازه‌ای برای این حساب در رویدادهای GitHub پیدا نشد.",
                  "پس امروز تغییر کد یا مشارکت مشخصی برای آموزش گزارش نمی‌کنم تا چیزی ساختگی گفته نشود.",
                  "",
                  "🎯 تمرین پیشنهادی: یکی از PRهای قبلی خودت را باز کن، بخش Files changed را بخوان و برای هر فایل یک جمله درباره دلیل تغییرش بنویس.",
              ]
          else:
              for event, obj in contributions[:5]:
                  repo = event.get("repo", {}).get("name", "unknown/repository")
                  kind = "Pull Request" if event["type"] == "PullRequestEvent" else "Issue"
                  action = event.get("payload", {}).get("action", "updated")
                  lines += [
                      "━━━━━━━━━━━━━━━━━━",
                      f"{'🔀' if kind == 'Pull Request' else '📝'} {kind}: {obj.get('title', 'بدون عنوان')}",
                      f"📦 مخزن: {repo}",
                      f"⚙️ رویداد: {action}",
                      f"🔗 {obj['html_url']}",
                  ]

                  if kind == "Pull Request":
                      pr_number = obj.get("number")
                      repo_encoded = urllib.parse.quote(repo, safe="/")
                      try:
                          files = api(f"https://api.github.com/repos/{repo_encoded}/pulls/{pr_number}/files?per_page=30")
                      except Exception as exc:
                          files = []
                          lines.append(f"⚠️ دریافت جزئیات فایل‌ها ممکن نشد: {type(exc).__name__}")

                      if files:
                          lines.append("📂 فایل‌های تغییرکرده:")
                          for file in files[:12]:
                              filename = file.get("filename", "unknown")
                              status = file.get("status", "modified")
                              additions = file.get("additions", 0)
                              deletions = file.get("deletions", 0)
                              lines.append(f"• {filename} ({status}، +{additions}/-{deletions})")
                              patch = file.get("patch", "")
                              if patch:
                                  meaningful = [x for x in patch.splitlines() if x.startswith("+") and not x.startswith("+++")]
                                  if meaningful:
                                      sample = " | ".join(x[1:].strip() for x in meaningful[:2])
                                      if sample:
                                          lines.append(f"  نمونه کد اضافه‌شده: {sample[:240]}")
                          lines += [
                              "🧠 چطور تغییر را بفهمی؟",
                              "۱) اول فایل‌های بالا را در مخزن باز کن و نقش هر فایل را مشخص کن.",
                              "۲) خطوط اضافه/حذف‌شده را با مسئله PR مقایسه کن؛ ببین دقیقاً چه رفتاری عوض شده است.",
                              "۳) اگر تستی وجود دارد، نتیجه Checks در صفحه PR را بررسی کن. این گزارش خودش تست را اجرا نکرده است.",
                              "۴) بتوانی با زبان خودت توضیح بدهی چرا این تغییر لازم بوده و چه حالت‌هایی را پوشش می‌دهد.",
                          ]
                      else:
                          lines.append("جزئیات فایل‌های تغییرکرده در دسترس نبود؛ از روی عنوان PR درباره کد حدس نمی‌زنم.")
                  else:
                      body = " ".join((obj.get("body") or "").split())
                      if body:
                          lines.append("📖 شرح مسئله: " + body[:900])
                      lines += [
                          "🧠 تمرین: مسئله را با کلمات خودت بازنویسی کن، شرایط بازتولیدش را بنویس و یک راه‌حل کوچک پیشنهاد بده.",
                      ]
                  lines.append("")

          lines += [
              "📌 یادآوری: این گزارش بر اساس رویدادهای عمومی GitHub است؛ اگر مشارکت روزانه در حساب/مخزن خصوصی باشد یا هنوز PR/Issue عمومی ایجاد نشده باشد، این Workflow آن را نمی‌بیند.",
              "🤖 این Workflow گزارش و درس مبتنی بر داده‌های واقعی PR/Issue می‌سازد؛ خودش کد را تغییر نمی‌دهد، PR ایجاد نمی‌کند و ادعای اجرای تست ندارد.",
          ]

          message = "\n".join(lines)
          if len(message) > 3900:
              message = message[:3820] + "\n\n… برای جزئیات بیشتر لینک PR را باز کن."

          payload = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": message,
              "disable_web_page_preview": "true",
          }).encode()
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{bot_token}/sendMessage",
              data=payload,
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.loads(response.read().decode("utf-8"))
          if not result.get("ok"):
              raise RuntimeError("Telegram API did not confirm delivery")
          print("Telegram learning report delivered successfully.")
          PY
