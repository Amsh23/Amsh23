name: Daily AI Open Source Contributor

on:
  schedule:
    # Once a day at 03:11 UTC. Off the top of the hour on purpose:
    # GitHub delays/drops scheduled runs at :00 when load is high.
    - cron: "11 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate a patch but do not open a PR"
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/daily-open-source-ai-agent.yml'
      - 'scripts/**'

# Least privilege for GITHUB_TOKEN. Forking and opening PRs on other people's
# repositories uses the GH_PAT secret instead (GITHUB_TOKEN cannot do that).
permissions:
  contents: read
  actions: write # only used by the keep-alive step below

concurrency:
  group: daily-open-source-ai-agent
  cancel-in-progress: false

jobs:
  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --quiet "requests==2.32.3" "PyYAML==6.0.2"
      - name: Run offline unit and integration tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

  agent:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet "requests==2.32.3" "PyYAML==6.0.2"

      - name: Run agent unit tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Restore rejected/seen-issue memory
        uses: actions/cache/restore@v4
        with:
          path: .agent_state
          key: agent-state-${{ github.run_id }}
          restore-keys: agent-state-

      - name: Run agent
        id: agent
        continue-on-error: true # so the report/Telegram steps always run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_PAT: ${{ secrets.GH_PAT || secrets.PAT_FOR_PR }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.OPENROUTER_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/auto' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          AGENT_MIN_STARS: ${{ vars.AGENT_MIN_STARS || '0' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python scripts/daily_agent.py run

      - name: Save seen-issue memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .agent_state
          key: agent-state-${{ github.run_id }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-agent-report
          path: out/
          if-no-files-found: ignore

      - name: Telegram report
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT }}
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
        run: python scripts/daily_agent.py telegram

      # Scheduled workflows in public repos are auto-disabled after 60 days
      # without repo activity; re-enabling each run is the common workaround.
      - name: Keep schedule enabled
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/daily-open-source-ai-agent.yml/enable"

      - name: Fail the job if the agent failed
        if: steps.agent.outcome == 'failure'
        run: |
          echo "Agent step failed (provider failure or crash). See the report artifact."
          exit 1